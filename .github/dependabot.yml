version: 2
updates:
  # Daily security updates
  - package-ecosystem: "gomod"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "Europe/Oslo"
    assignees:
      - "n0rdy"
    # Enables security updates only
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "Europe/Oslo"
    assignees:
      - "n0rdy"
    # Enables security updates only
    open-pull-requests-limit: 0
  - package-ecosystem: "docker"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "Europe/Oslo"
    assignees:
      - "n0rdy"
    # Enables security updates only
    open-pull-requests-limit: 0
  - package-ecosystem: "npm"
    target-branch: "main"
    directories:
      - "/site"
      - "/ui/assets"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "Europe/Oslo"
    assignees:
      - "n0rdy"
    # Enables security updates only
    open-pull-requests-limit: 0

  # Weekly updates for all packages
  # cooldown: skip versions younger than N days. Registry-wide malware scanners usually flag a
  # poisoned release within hours (LiteLLM 1.107.0: ~7 minutes), so a week's wait keeps it out
  # of our lockfiles. Security updates (the daily entries above) are exempt and arrive immediately.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "12:00"
      timezone: "Europe/Oslo"
    assignees:
      - "n0rdy"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      gomod:
        patterns:
          - "**"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "12:00"
      timezone: "Europe/Oslo"
    assignees:
      - "n0rdy"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "**"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "12:00"
      timezone: "Europe/Oslo"
    assignees:
      - "n0rdy"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "**"
  - package-ecosystem: "npm"
    directories:
      - "/site"
      - "/ui/assets"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "12:00"
      timezone: "Europe/Oslo"
    assignees:
      - "n0rdy"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm:
        patterns:
          - "**"
