name: CI - Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check dependencies are tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod or go.sum needs to be updated"
            git diff go.mod go.sum
            exit 1
          fi

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l . | grep -v _templ.go || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "Code is not formatted properly:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Check generated templates are fresh
        run: |
          go tool templ generate
          if [ -n "$(git status --porcelain '*_templ.go')" ]; then
            echo "Generated templ files are stale - run 'go tool templ generate' and commit"
            git status --porcelain '*_templ.go'
            exit 1
          fi

      - name: Setup Node (asset toolchain)
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: ui/assets/package-lock.json

      - name: Check compiled CSS is fresh
        working-directory: ui/assets
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          npm ci
          npx tailwindcss -i input.css -o ../static/styles.css --minify
          if [ -n "$(git status --porcelain ../static/styles.css)" ]; then
            # the file is minified onto one line, so a plain git diff is useless;
            # split both versions on '}' to get one rule per line before diffing
            git show HEAD:ui/static/styles.css | tr '}' '\n' > /tmp/css.committed
            tr '}' '\n' < ../static/styles.css > /tmp/css.rebuilt
            {
              echo "## ui/static/styles.css is stale"
              echo
              git fetch --quiet --depth=1 origin "$BASE_REF"
              if [ -n "$(git diff --name-only "origin/$BASE_REF" HEAD -- package.json package-lock.json)" ]; then
                echo "**Cause:** this PR bumps the CSS toolchain (tailwindcss / daisyui), so the compiled output changed."
              else
                echo "**Cause:** a template or input.css changed without recompiling the stylesheet."
              fi
              echo
              echo "**Fix:**"
              echo '```'
              echo "git fetch origin && git checkout \"$HEAD_REF\""
              echo "cd ui/assets && npm ci && npm run css"
              echo "git add ../static/styles.css && git commit -m 'css: rebuild stylesheet' && git push"
              echo '```'
              echo
              echo "<details><summary>What changed (one CSS rule per line)</summary>"
              echo
              echo '```diff'
              diff -u /tmp/css.committed /tmp/css.rebuilt | tail -n +3 | grep -E '^[+-]' | head -200
              echo '```'
              echo "</details>"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error file=ui/static/styles.css::compiled CSS is stale - see the job summary for the cause, the fix commands, and the diff"
            exit 1
          fi

      # the sqlite_fts5 tag is mandatory: without it the binary builds fine
      # but fails at startup (no such module: fts5), so an untagged build
      # proves nothing
      - name: Run go vet
        run: go vet -tags sqlite_fts5 ./...

      - name: Build application
        run: go build -tags sqlite_fts5 -v ./...

      - name: Run tests
        run: go test -tags sqlite_fts5 -race -count=1 ./...

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: quality-checks
    if: always()

    steps:
      - name: Check quality gate status
        run: |
          if [ "${{ needs.quality-checks.result }}" != "success" ]; then
            echo "Quality checks failed - blocking merge"
            exit 1
          else
            echo "Quality checks passed"
          fi
