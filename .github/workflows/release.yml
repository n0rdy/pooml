name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

# CGO builds (mattn/go-sqlite3 with the vendored amalgamation), so each arch
# builds on a native runner instead of cross-compiling. The sqlite_fts5 tag is
# mandatory everywhere: an untagged binary starts and immediately dies on the
# logs migration.

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Build AMD64 binary
      run: |
        CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -tags sqlite_fts5 \
          -ldflags="-s -w" \
          -o pooml-linux-amd64 .

    - name: Create AMD64 archive
      run: |
        mkdir -p dist
        tar -czf dist/pooml_Linux_x86_64.tar.gz pooml-linux-amd64 LICENSE README.md
        sha256sum dist/pooml_Linux_x86_64.tar.gz > dist/pooml_Linux_x86_64.tar.gz.sha256

    - name: Upload AMD64 artifacts
      uses: actions/upload-artifact@v7
      with:
        name: amd64-release
        path: |
          dist/
          pooml-linux-amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Build ARM64 binary
      run: |
        CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -tags sqlite_fts5 \
          -ldflags="-s -w" \
          -o pooml-linux-arm64 .

    - name: Create ARM64 archive
      run: |
        mkdir -p dist
        tar -czf dist/pooml_Linux_arm64.tar.gz pooml-linux-arm64 LICENSE README.md
        sha256sum dist/pooml_Linux_arm64.tar.gz > dist/pooml_Linux_arm64.tar.gz.sha256

    - name: Upload ARM64 artifacts
      uses: actions/upload-artifact@v7
      with:
        name: arm64-release
        path: |
          dist/
          pooml-linux-arm64

  docker:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Download AMD64 artifacts
      uses: actions/download-artifact@v8
      with:
        name: amd64-release
        path: ./

    - name: Download ARM64 artifacts
      uses: actions/download-artifact@v8
      with:
        name: arm64-release
        path: ./

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Extract version
      id: version
      run: |
        echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Build and push multi-arch image
      run: |
        # binaries are glibc (built on ubuntu runners), so the runtime base
        # must be glibc too - alpine/musl would not run them
        cat > Dockerfile.multiarch << 'EOF'
        FROM debian:bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates \
            && rm -rf /var/lib/apt/lists/* \
            && groupadd -g 1001 pooml && useradd -u 1001 -g pooml -m pooml \
            && mkdir -p /data && chown pooml:pooml /data
        WORKDIR /app
        ARG TARGETARCH
        COPY pooml-linux-${TARGETARCH} pooml
        RUN chmod +x pooml && chown pooml:pooml pooml
        USER pooml
        EXPOSE 8080 8081
        ENV POOML_ENV=pro \
            POOML_DB_DIR=/data \
            POOML_API_ADDR=0.0.0.0:8080 \
            POOML_UI_ADDR=0.0.0.0:8081
        VOLUME /data
        CMD ["./pooml"]
        EOF

        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --file Dockerfile.multiarch \
          --tag ${{ secrets.DOCKER_USERNAME }}/pooml:${{ steps.version.outputs.VERSION }} \
          --tag ${{ secrets.DOCKER_USERNAME }}/pooml:latest \
          --push \
          .

  release:
    needs: [build-amd64, build-arm64, docker]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download AMD64 artifacts
      uses: actions/download-artifact@v8
      with:
        name: amd64-release
        path: ./amd64/

    - name: Download ARM64 artifacts
      uses: actions/download-artifact@v8
      with:
        name: arm64-release
        path: ./arm64/

    - name: Prepare release assets
      run: |
        mkdir -p release
        cp amd64/dist/* release/
        cp arm64/dist/* release/
        cd release
        cat *.sha256 > checksums.txt
        ls -la

    - name: Extract version
      id: version
      run: |
        echo "FULL_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    # changelog goes through a file, not GITHUB_OUTPUT: commit messages are
    # multi-line and untrusted for heredoc purposes
    - name: Generate release notes
      env:
        FULL_VERSION: ${{ steps.version.outputs.FULL_VERSION }}
      run: |
        {
          echo "## $FULL_VERSION"
          echo ""
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "### Changes since $PREV_TAG"
            echo ""
            git log --oneline "$PREV_TAG"..HEAD | sed 's/^/- /'
          else
            echo "Initial release."
          fi
          echo ""
          echo "### Installation"
          echo ""
          echo "See the [README](https://github.com/n0rdy/pooml#quick-start) for binary, source, and Docker instructions."
        } > notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.version.outputs.FULL_VERSION }}
        name: ${{ steps.version.outputs.FULL_VERSION }}
        body_path: notes.md
        files: |
          release/*
        draft: false
        prerelease: false
