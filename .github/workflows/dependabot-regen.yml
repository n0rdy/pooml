name: Dependabot - Regenerate Assets

# Bumps change generated output (templ via go.mod, compiled CSS via ui/assets)
# that dependabot can't produce. The bumped code runs with a read-only token;
# only the commit job, which executes nothing from the dependencies, can push.
on:
  pull_request:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'ui/assets/package.json'
      - 'ui/assets/package-lock.json'

permissions:
  contents: read

concurrency:
  group: dependabot-regen-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regen:
    name: Regenerate
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node (asset toolchain)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: ui/assets/package-lock.json

      - name: Regenerate templates
        run: go tool templ generate

      - name: Rebuild stylesheet
        working-directory: ui/assets
        run: |
          npm ci --ignore-scripts
          npm run css

      - name: Collect diff
        id: diff
        run: |
          git diff --binary -- ui/static/styles.css '*_templ.go' > "$RUNNER_TEMP/regen.patch"
          if [ -s "$RUNNER_TEMP/regen.patch" ]; then
            git diff --stat -- ui/static/styles.css '*_templ.go'
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Generated files are already fresh"
          fi

      - name: Upload patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regen-patch
          path: ${{ runner.temp }}/regen.patch
          retention-days: 1

  commit:
    name: Commit regenerated files
    needs: regen
    if: needs.regen.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # pushes made with GITHUB_TOKEN don't trigger workflows, so the quality
      # gates on the new commit have to be dispatched explicitly
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: regen-patch
          path: ${{ runner.temp }}

      - name: Commit and push
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git apply --index "$RUNNER_TEMP/regen.patch"
          # the patch was produced next to dependency code, so only generated files may go through
          if git diff --cached --name-only | grep -vE '^ui/static/styles\.css$|_templ\.go$'; then
            echo "::error::regen patch touches files outside the generated set"
            exit 1
          fi
          # *_templ.go is compiled into the binary: a bump may change generated
          # files but never add, delete or rename one (lowercase m = "not modified")
          if git diff --cached --name-only --diff-filter=m | grep .; then
            echo "::error::regen patch adds or removes files; only edits to existing generated files are allowed"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate templates and CSS after dependency bump'
          # pushing the detached head sha fails if dependabot moved the branch meanwhile
          git push origin "HEAD:refs/heads/$HEAD_REF"

      - name: Run quality gates on the new commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: gh workflow run quality-gates.yml --ref "$HEAD_REF"
